name: Kiểm tra song ngữ VI/EN

on:
  push:
    paths: ["kho-featured.json", "kho-data.js", "kho-en.js", "i18n/**", "community-data.js", "assets/content.json", "tools/i18n-*"]
  pull_request:
    paths: ["kho-featured.json", "kho-data.js", "kho-en.js", "i18n/**", "community-data.js", "assets/content.json", "tools/i18n-*"]

permissions:
  contents: read

jobs:
  i18n:
    name: Dữ liệu mới phải có bản _en
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/i18n-check.mjs
