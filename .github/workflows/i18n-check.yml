name: Kiểm tra song ngữ VI/EN

on:
  push:
    paths: ["kho-featured.json", "kho-data.js", "kho-en.js", "i18n/**", "community-data.js", "assets/content.json", "tools/i18n-*"]
  # Không giới hạn paths ở pull_request: kiểm tra này là "required", nếu PR không đụng file dữ liệu mà workflow không chạy thì check
  # kẹt ở "Expected" và PR không merge được. Script chạy rất nhẹ nên cho chạy trên mọi PR.
  pull_request:

permissions:
  contents: read

jobs:
  i18n:
    name: Dữ liệu mới phải có bản _en
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/i18n-check.mjs
